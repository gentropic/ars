<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ars — viewer</title>
<!-- js-aruco2 classic scripts FIRST (AR / CV / POS / SVD globals), then ESM -->
<script src="../vendor/js-aruco2/cv.js"></script>
<script src="../vendor/js-aruco2/aruco.js"></script>
<script src="../vendor/js-aruco2/svd.js"></script>
<script src="../vendor/js-aruco2/posit1.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               font: 13px/1.4 ui-monospace, monospace; color: #d8dee9; }
  #stage { position: fixed; inset: 0; }
  #video, #gl { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #gl { pointer-events: none; }
  #hud { position: fixed; left: 8px; top: 8px; z-index: 10; background: rgba(20,24,30,.78);
         padding: 8px 10px; border-radius: 6px; max-width: 80vw; white-space: pre-wrap; }
  #hud b { color: #e8b04b; }
  #buttons { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 20;
             display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  #buttons button { padding: 14px 20px; font: 16px system-ui; background: #e8b04b; color: #14181e;
                    border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
  #buttons button.alt { background: #2a323e; color: #d8dee9; }
  #buttons button[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
</div>
<div id="hud"><b>ars viewer</b> — waiting…</div>
<div id="buttons">
  <button id="start-ar" hidden>start AR (anchored)</button>
  <button id="start" class="alt">start camera (magic-window)</button>
</div>

<script type="module">
// The phone viewer (DESIGN.md stage 2 + 2b): joins the studio's room,
// receives the scene, localizes on the printed mat, renders in mat space.
// THREE TIERS, one URL, decided at start:
//   1. WebXR + camera-access (Android Chrome): immersive AR — the datum is
//      hit-test-fused and WORLD-ANCHORED (xr-ground.js, the m3 machinery);
//      content stays glued to the table when markers leave view.
//   2. getUserMedia magic-window (iOS Safari, desktops): strict marker-based —
//      the datum only updates with ≥2 gated references in frame (a lone
//      marker's POSIT ambiguity flips near-frontal; the constellation
//      disambiguates structurally — bench-magicwindow).
//   3. neither: a clear message.
// camera-access is only knowable at requestSession time (visionOS has
// immersive-ar but no camera-access) — so tier 1 is an ATTEMPT that falls
// back to tier 2 on any refusal.
import * as THREE from '../vendor/three/three.module.min.js';
import { createDetector, detect, markerPose } from './detect.js';
import { classGate, solveDatum, mat4 } from '../src/main.js';
import { createStore } from '../studio/src/store.js';
import { build, RENDERABLE } from '../studio/src/objects.js';
import { createSync, APP_ID } from '../studio/src/sync.js';
import { createXRGround } from './xr-ground.js';
import { createBlocksMount } from '../studio/src/blocks.js';

const $ = (s) => document.querySelector(s);
const hud = $('#hud'), video = $('#video'), glCanvas = $('#gl');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });

const store = createStore();
let detector, renderer, scene, camera, content;
let sync = null, running = false, testMode = false, mode = 'flat';
let datumAt = 0, roomCode = null, refsSeen = 0, ground = null;
const camInMat = new THREE.Matrix4();

// mat layout (the same file the PDF and the studio use)
const MAT = await (await fetch('../webxr/assets/ars-mat-manifest.json')).json();
const MAT_IDS = MAT.variants.ARUCO_MIP_36h12.ids;
const OVERRIDES = Object.fromEntries(MAT_IDS.map((id) => [id, 'reference']));
const MAT_POSE = Object.fromEntries(MAT_IDS.map((id) => {
  const t = MAT.layout[String(id)].t;
  return [id, mat4.fromRT([1, 0, 0, 0, 1, 0, 0, 0, 1], t)];
}));

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(1, 2, 3);
  scene.add(dir);
  camera = new THREE.PerspectiveCamera(60, 1, 0.001, 100);
  content = new THREE.Group();                 // the scene document, in mat space
  content.matrixAutoUpdate = false;            // matrix = T (mat → camera)
  content.visible = false;
  scene.add(content);
}

// store → content reconciliation (same discipline as the studio view)
const nodes = new Map();
function reconcile() {
  const live = new Set();
  for (const obj of store.all()) {
    if (!RENDERABLE.has(obj.kind)) continue;
    live.add(obj.id);
    const cur = nodes.get(obj.id);
    if (!cur || cur.stamp !== obj.stamp) {
      if (cur) content.remove(cur.node);
      const node = build(obj, store);
      nodes.set(obj.id, { stamp: obj.stamp, node });
      content.add(node);
    }
  }
  for (const [id, cur] of nodes)
    if (!live.has(id)) { content.remove(cur.node); nodes.delete(id); }
}
store.onChange(reconcile);

// ── condenser blocks under the three pass (§3.1 order-0; DESIGN stage 4) ──
let blocksMount = null;
const _bm = new THREE.Matrix4(), _bmi = new THREE.Matrix4(), _bvwi = new THREE.Matrix4();
function drawBlocksUnder(projEls, viewWorldEls, eyeArr, fb) {
  if (!blocksMount) blocksMount = createBlocksMount(renderer.getContext(),
    { getBlob: (h) => store.getBlob(h) });
  const bo = content.visible ? (store.byKind('blocks')[0] || null) : null;
  const ready = blocksMount.sync(bo);
  if (!bo || !ready) { renderer.autoClear = true; return; }
  const entry = nodes.get(bo.id);
  const mp = blocksMount.modelParams();
  if (!entry || !mp) { renderer.autoClear = true; return; }
  renderer.autoClear = false;
  const gl = renderer.getContext();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb || null);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.clearColor(0, 0, 0, 0);                    // transparent — camera/passthrough
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  scene.updateMatrixWorld();
  _bm.copy(entry.node.matrixWorld)
     .multiply(new THREE.Matrix4().makeScale(mp.k, mp.k, mp.k))
     .multiply(new THREE.Matrix4().makeTranslation(mp.off[0], mp.off[1], mp.off[2]));
  _bmi.copy(_bm).invert();
  blocksMount.draw(projEls, viewWorldEls, eyeArr, _bm.elements, _bmi.elements,
    { edges: bo.props.edges !== false });
  renderer.resetState();
}

function joinWith(room) {
  sync = createSync(store, room, {
    role: 'viewer',
    onPeers: () => {},
  });
  return sync;
}
async function joinIfRoom() {
  if (!testMode && roomCode && !sync) {
    const { joinRoom } = await import('../vendor/trystero/torrent.js');
    joinWith(joinRoom({ appId: APP_ID }, roomCode));
  }
}

function status() {
  hud.innerHTML = `<b>ars viewer</b> room ${roomCode || '—'} · ` +
    `${store.all().filter((o) => RENDERABLE.has(o.kind)).length} object(s)\n` +
    `${refsSeen} mat marker(s) in view` +
    (content.visible ? ' · localized' : ' · show ≥2 mat markers to localize');
}

function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  const W = video.videoWidth, H = video.videoHeight;
  if (!W || !H) return;
  if (work.width !== W) { work.width = W; work.height = H; }

  // GL buffer = detection frame, so object-fit:cover crops both identically
  const focalPx = W;
  if (renderer.domElement.width !== W) renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.fov = 2 * Math.atan((H / 2) / focalPx) * 180 / Math.PI;
  camera.updateProjectionMatrix();

  wctx.drawImage(video, 0, 0, W, H);
  const markers = detect(detector, wctx.getImageData(0, 0, W, H));

  const obs = [];
  for (const m of markers) {
    if (!(m.id in MAT_POSE)) continue;
    const p = markerPose(m.corners, { sizeMeters: MAT.markerSize, focalPx, width: W, height: H });
    if (p) obs.push({ id: m.id, matPose: MAT_POSE[m.id], observedPose: p.matrix, size: MAT.markerSize });
  }
  const refs = classGate(obs, { overrides: OVERRIDES });
  refsSeen = refs.length;
  if (refs.length >= 2) {
    const datum = solveDatum(refs);
    if (datum.transform) {
      content.matrix.fromArray(Array.from(datum.transform));
      content.visible = true;
      datumAt = performance.now();
      camInMat.copy(content.matrix).invert();  // viewer pose in mat space
      if (sync) sync.sendPose(camInMat.toArray());
    }
  }
  if (performance.now() - datumAt > 1500) content.visible = false;

  camera.updateMatrixWorld();
  _bvwi.copy(camera.matrixWorld).invert();
  drawBlocksUnder(camera.projectionMatrix.elements, _bvwi.elements,
    camera.position.toArray(), null);
  renderer.render(scene, camera);
  status();
}

async function start() {
  $('#buttons').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    hud.innerHTML = '<b>camera error:</b> ' + e.message;
    return;
  }
  detector = createDetector();
  await joinIfRoom();
  running = true;
  requestAnimationFrame(loop);
}

// ── tier 1: WebXR, world-anchored (Android Chrome) ─────────────────────────
async function startXR() {
  $('#buttons').style.display = 'none';
  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      // camera-access REQUIRED is the tier test: platforms without it
      // (visionOS among them) reject here and we fall back cleanly
      requiredFeatures: ['local', 'camera-access', 'hit-test', 'anchors'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body },
    });
  } catch (e) {
    hud.innerHTML = '<b>ars viewer</b> — AR unavailable (' + (e.name || e.message) +
      '), falling back to magic-window…';
    $('#buttons').style.display = '';
    $('#start-ar').hidden = true;
    return start();
  }
  mode = 'xr';
  video.style.display = 'none';
  session.addEventListener('end', () => location.reload());
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  const gl = renderer.getContext();
  const baseSpace = await session.requestReferenceSpace('local');
  const binding = new XRWebGLBinding(session, gl);
  detector = createDetector();
  ground = createXRGround({ gl, session, baseSpace, binding, detector,
    mat: { size: MAT.markerSize, matPose: MAT_POSE, overrides: OVERRIDES } });
  await joinIfRoom();
  const mInv = new THREE.Matrix4(), camM = new THREE.Matrix4(), vwi = new THREE.Matrix4();
  renderer.setAnimationLoop((t, frame) => {
    if (!frame) return;
    const pose = frame.getViewerPose(baseSpace);
    if (pose) {
      const view = pose.views[0];
      ground.onFrame(frame, view);
      renderer.resetState();                    // the tap's raw GL vs three's state cache
      const T = ground.datumWorld(frame);
      if (T) {
        content.matrix.fromArray(T);
        content.visible = true;
        if (sync) {
          camM.fromArray(view.transform.matrix);
          mInv.copy(content.matrix).invert().multiply(camM);
          sync.sendPose(mInv.toArray());
        }
      }
      camM.fromArray(view.transform.matrix);
      vwi.copy(camM).invert();
      drawBlocksUnder(view.projectionMatrix, vwi.elements,
        [camM.elements[12], camM.elements[13], camM.elements[14]],
        (session.renderState.baseLayer && session.renderState.baseLayer.framebuffer) || null);
    }
    renderer.render(scene, camera);
    statusXR();
  });
  hud.innerHTML = '<b>ars viewer</b> — AR: aim at the printed mat';
}

function statusXR() {
  const s = ground.stats, gg = ground.group;
  hud.innerHTML = `<b>ars viewer</b> AR · room ${roomCode || '—'} · ` +
    `${store.all().filter((o) => RENDERABLE.has(o.kind)).length} object(s)\n` +
    (gg.anchor ? '⚓ world-anchored' : gg.seenFusedPose ? '◈ fused, anchoring…' : 'looking for the mat') +
    ` · ${gg.refs} ref${gg.confident ? ' (confident)' : ''} · ${s.markersInView} in view` +
    ` · det ${s.det.toFixed(1)} ms · fus ${s.fusOk}/${s.fusReq}` +
    (s.kEma ? ` · scale ×${s.kEma.toFixed(2)}` : '') +
    (s.rejWhy ? `\nrej: ${s.rejWhy}` : '');
}

// boot
{
  const h = new URLSearchParams(location.hash.slice(1));
  roomCode = h.get('r');
  testMode = h.has('test');
  initThree();
  if (testMode) {
    // harness hook: no camera, no trackers — the smoke injects a fake room
    // and drives the datum directly
    $('#start').style.display = 'none';
    window.__viewer = {
      store, content, reconcile, joinWith,
      setDatum(m16) {
        content.matrix.fromArray(m16);
        content.visible = true;
        datumAt = Infinity;
      },
      render() { renderer.setSize(innerWidth, innerHeight, false);
                 camera.aspect = innerWidth / innerHeight;
                 camera.updateProjectionMatrix();
                 renderer.render(scene, camera); },
    };
    hud.innerHTML = '<b>ars viewer</b> — test mode';
  } else {
    $('#start').addEventListener('click', start);
    $('#start-ar').addEventListener('click', startXR);
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-ar')
        .then((ok) => { $('#start-ar').hidden = !ok; })
        .catch(() => {});
    }
    if (!roomCode) hud.innerHTML = '<b>ars viewer</b> — no room in URL (open from the studio QR); ' +
      'camera-only mode: the mat still localizes, the scene stays empty';
    else hud.innerHTML = '<b>ars viewer</b> — room ' + roomCode + ' · tap start';
    // harness hooks (inert unless a test drives them)
    window.__viewerXR = { store, content, joinWith, ground: () => ground, mode: () => mode,
                          blocksStats: () => blocksMount && blocksMount.stats };
  }
}
</script>
</body>
</html>
